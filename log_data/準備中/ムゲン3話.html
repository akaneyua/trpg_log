<style>
    /* main css */
    .bg-inner.bg1{background:url('./ダンザイ画像素材/ダンザイ_背景素材.png') no-repeat center/cover;}
    
    /* member */
    .mem1 p{border:2px solid rgb(233, 30, 99);box-shadow:5px 5px 0 rgb(233, 30, 99);}
    .mem1 p:after{border-right-color:rgb(233, 30, 99);}
    .mem1 span{background:rgb(233, 30, 99);color:#000;}
    .mem1:before{content:'';background-image:url('./ダンザイ画像素材/icon_pc1.png');background-size:contain;background-repeat:no-repeat;background-position:center center;width:90px;height:90px;}
    .mem2 p{border:2px solid rgb(136, 136, 136);box-shadow:5px 5px 0 rgb(136, 136, 136);}
    .mem2 p:after{border-left-color:rgb(136, 136, 136);}
    .mem2 span{background:rgb(136, 136, 136);color:#fff;}
    .mem2:before{content:'';background-image:url('./ダンザイ画像素材/icon_npc3.png');background-size:contain;background-repeat:no-repeat;background-position:center center;width:90px;height:90px;}
    .mem3 p{border:2px solid rgb(121, 85, 72);box-shadow:5px 5px 0 rgb(121, 85, 72);}
    .mem3 p:after{border-right-color:rgb(121, 85, 72);}
    .mem3 span{background:rgb(121, 85, 72);color:#fff;}
    .mem3:before{content:'';background-image:url('./ダンザイ画像素材/icon_npc2.png');background-size:contain;background-repeat:no-repeat;background-position:center center;width:90px;height:90px;}
    .mem4 p{border:2px solid rgb(33, 150, 243);box-shadow:5px 5px 0 rgb(33, 150, 243);}
    .mem4 p:after{border-left-color:rgb(33, 150, 243);}
    .mem4 span{background:rgb(33, 150, 243);color:#000;}
    .mem4:before{content:'';background-image:url('./ダンザイ画像素材/icon_pc3.png');background-size:contain;background-repeat:no-repeat;background-position:center center;width:90px;height:90px;}
    .mem5 p{border:2px solid rgb(139, 195, 74);box-shadow:5px 5px 0 rgb(139, 195, 74);}
    .mem5 p:after{border-right-color:rgb(139, 195, 74);}
    .mem5 span{background:rgb(139, 195, 74);color:#fff;}
    .mem5:before{content:'';background-image:url('./ダンザイ画像素材/icon_pc2.png');background-size:contain;background-repeat:no-repeat;background-position:center center;width:90px;height:90px;}
    .mem6 p{border:2px solid rgb(158, 158, 158);box-shadow:5px 5px 0 rgb(158, 158, 158);}
    .mem6 p:after{border-left-color:rgb(158, 158, 158);}
    .mem6 span{background:rgb(158, 158, 158);color:#fff;}
    .mem6:before{content:'';background-image:url('./ダンザイ画像素材/icon_npc1.png');background-size:contain;background-repeat:no-repeat;background-position:center center;width:90px;height:90px;}
    
    @media only screen and (max-width: 768px) {
        .mem1 p:after{border-right-color:rgb(233, 30, 99);border-left-color:transparent;}
        .mem2 p:after{border-right-color:rgb(136, 136, 136);border-left-color:transparent;}
        .mem3 p:after{border-right-color:rgb(121, 85, 72);border-left-color:transparent;}
        .mem4 p:after{border-right-color:rgb(33, 150, 243);border-left-color:transparent;}
        .mem5 p:after{border-right-color:rgb(139, 195, 74);border-left-color:transparent;}
        .mem6 p:after{border-right-color:rgb(158, 158, 158);border-left-color:transparent;}
    
        .mem1:before,.mem2:before,.mem3:before,
        .mem4:before,.mem5:before,.mem6:before{width:70px;height:70px;}
    }
</style>
